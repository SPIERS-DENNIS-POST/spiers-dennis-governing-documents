name: Publish historical scan previews
on:
  push:
    paths:
      - ".github/workflows/create_scan_previews_v20261109T192400Z.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render original scanned pages and link them
        run: |
          set -euo pipefail
          python -m pip install --quiet "pymupdf==1.26.5"
          python - <<'PY'
          from pathlib import Path
          import hashlib,fitz
          source=Path("sources/2004-signed-constitution-and-bylaws.pdf")
          if hashlib.sha256(source.read_bytes()).hexdigest()!="2dcf36251d5437cee43acc9b2f3ebf523b200edbbeaca455a7eeadcf552f72ef": raise SystemExit("Source PDF checksum mismatch")
          document=fitz.open(source)
          names=["page-01-constitution.png","page-02-constitution.png","page-03-bylaws.png","page-04-bylaws.png","page-05-bylaws.png"]
          if len(document)!=len(names): raise SystemExit("Unexpected number of scanned pages")
          output=Path("sources/scan-previews")
          if output.exists(): raise SystemExit("Scan previews already exist")
          output.mkdir(parents=True)
          for page,name in zip(document,names):
              pix=page.get_pixmap(matrix=fitz.Matrix(200/72,200/72),colorspace=fitz.csGRAY,alpha=False)
              if (pix.width,pix.height)!=(1700,2200): raise SystemExit("Unexpected page dimensions")
              pix.save(output/name)
          sections=["# Signed Constitution and Bylaws — scanned page previews","These images are lossless 200-dpi renderings of the five-page historical scan, provided for GitHub viewing. They are viewing aids, not the original source or a newly certified edition.","[Original five-page PDF](../2004-signed-constitution-and-bylaws.pdf)","## Constitution — pages 1–2","![Constitution, page 1](page-01-constitution.png)","![Constitution, page 2](page-02-constitution.png)","## Bylaws — pages 3–5","![Bylaws, page 1](page-03-bylaws.png)","![Bylaws, page 2](page-04-bylaws.png)","![Bylaws, page 3](page-05-bylaws.png)"]
          (output/"README.md").write_text("\n".join(sections)+"\n")
          readme=Path("README.md")
          original=readme.read_text()
          target="- [Original signed five-page scan](sources/2004-signed-constitution-and-bylaws.pdf)"
          if original.count(target)!=1: raise SystemExit("Expected source PDF link missing or duplicated")
          old_integrity="SHA-256 of source PDF: `66b03738e55f2109ee5050d700c75ef1a586ff9ade9237b5f123c22ae7caa63f`."\n          new_integrity="SHA-256 of current source PDF (structurally repaired; scan content unchanged): `2dcf36251d5437cee43acc9b2f3ebf523b200edbbeaca455a7eeadcf552f72ef`. Original uploaded scan SHA-256: `66b03738e55f2109ee5050d700c75ef1a586ff9ade9237b5f123c22ae7caa63f` (preserved in Git history)."\n          if original.count(old_integrity)!=1: raise SystemExit("Expected original source checksum reference missing or duplicated")\n          readme.write_text(original.replace(target,target+"\n- [View the five signed scan pages in GitHub](sources/scan-previews/README.md)",1).replace(old_integrity,new_integrity,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md sources/scan-previews
          git commit -m "Add readable historical scan previews"
          git push
